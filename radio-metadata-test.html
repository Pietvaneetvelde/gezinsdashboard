<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiAWaVi – Radiometadatatest</title><style>body{background:#10141c;color:#eef5ff;font:16px system-ui;margin:20px}article{background:#18344a;border-radius:12px;padding:14px;margin:9px 0}button{background:#087fae;color:white;border:0;border-radius:8px;padding:12px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui;color:#b9d0e4}</style><h1>Radiometadatatest</h1><p>Test per zender. Geen geluid. Elke test stopt automatisch na maximaal 15 seconden.</p><main id="list"></main><script>
const stations=[['MNM','https://icecast.vrtcdn.be/mnm-high.mp3'],['Studio Brussel','https://icecast.vrtcdn.be/stubru-high.mp3'],['Radio 1','https://icecast.vrtcdn.be/radio1-high.mp3'],['MNM Hits','https://icecast.vrtcdn.be/mnm_hits-high.mp3'],['JOE','https://streams.radio.dpgmedia.cloud/redirect/joe_fm/mp3'],['Qmusic','https://streams.radio.dpgmedia.cloud/redirect/qmusic_be/mp3'],['Willy','https://streams.radio.dpgmedia.cloud/redirect/willy_be/mp3'],['JOE Xmas','https://streams.radio.dpgmedia.cloud/redirect/joe_christmas/mp3'],['Nostalgie','https://playerservices.streamtheworld.com/api/livestream-redirect/NOSTALGIEWHATAFEELING.mp3']];
for(const [name,url] of stations){const a=document.createElement('article'),b=document.createElement('button'),p=document.createElement('pre');b.textContent='Test '+name;p.textContent='Nog niet getest';a.append(b,p);document.querySelector('#list').append(a);b.onclick=async()=>{b.disabled=true;p.textContent='Verbinding testen…';const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);let reader;try{const r=await fetch(url,{headers:{'Icy-MetaData':'1'},signal:c.signal,cache:'no-store'});p.textContent='HTTP '+r.status+'\n';if(!r.ok)throw Error('HTTP '+r.status);const n=Number(r.headers.get('icy-metaint'));if(!n){p.textContent+='Geen leesbare icy-metaint-header. Metadata mogelijk afwezig of niet vrijgegeven door CORS.';return}p.textContent+='ICY interval: '+n+' bytes\n';reader=r.body.getReader();let skip=n,left=-1,meta=[],found=false;while(!found){const {done,value}=await reader.read();if(done)break;for(const x of value){if(skip>0){skip--;continue}if(left===-1){left=x*16;meta=[];if(!left){skip=n;left=-1}continue}meta.push(x);if(--left===0){const str=new TextDecoder().decode(new Uint8Array(meta));const m=str.match(/StreamTitle='([^']*)'/);if(m&&m[1]){p.textContent+='Songinformatie: '+m[1];found=true;break}skip=n;left=-1}}}if(!found)p.textContent+='Geen songtitel ontvangen.'}catch(e){p.textContent+='\n'+(e.name==='AbortError'?'Time-out: geen resultaat binnen 15 seconden.':'Browserfout: '+e.message+' (mogelijk CORS of netwerk).')}finally{clearTimeout(timer);c.abort();if(reader)reader.cancel().catch(()=>{});b.disabled=false}}}
</script></html>
