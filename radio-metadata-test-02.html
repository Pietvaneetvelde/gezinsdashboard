<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MNM metadata test 02</title><style>body{background:#101f35;color:#fff;font:18px system-ui;padding:24px}button{background:#1689b5;color:white;border:0;border-radius:12px;padding:16px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#193550;padding:18px;border-radius:12px}</style><h1>MNM – metadata test 02</h1><p>VRT GraphQL – geen audio</p><button id="go">Test MNM</button><pre id="out">Klaar voor test.</pre><script>document.getElementById('go').onclick=async()=>{const out=document.getElementById('out');out.textContent='Aanvraag versturen…';const c=new AbortController();const t=setTimeout(()=>c.abort(),15000);try{const r=await fetch('https://www.vrt.be/vrtnu-api/graphql/public/v1',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',signal:c.signal,body:JSON.stringify({operationName:'Livestream',query:'query Livestream($pageId: ID!) { page(id: $pageId) { ... on PlaybackPage { player { subtitle title maxAge } } } }',variables:{pageId:'/vrtmax/livestream/audio/mnm/'}})});const j=await r.json();const p=j.data?.page?.player;out.textContent='HTTP '+r.status+'\n'+(p?'Artiest: '+p.subtitle+'\nTitel: '+p.title+'\nmaxAge: '+p.maxAge+'\n\n':'Geen player gevonden.\n')+JSON.stringify(j,null,2)}catch(e){out.textContent='Fout: '+e.message+'\nMogelijk CORS, netwerk of timeout. Bekijk eventueel de browserconsole.'}finally{clearTimeout(t)}};</script></html>
