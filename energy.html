const $=id=>document.getElementById(id), fmt=(v,u,d=0)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('nl-BE',{maximumFractionDigits:d})+' '+u:'—';let busy=false;function put(id,v,u,d){$(id).textContent=fmt(v,u,d)}function wire(id,v,reverse){$(id).classList.toggle('active',typeof v==='number'&&Math.abs(v)>5);$(id).classList.toggle('reverse',!!reverse)}function render(x){for(const [id,key,u,d] of [['solar','solar','W'],['s2','solar','W'],['house','house','W'],['h2','house','W'],['battery','battery','%',1],['b2','battery','%',1],['grid','grid','W'],['g2','grid','W'],['bp2','battery_power','W'],['health','battery_health','%',1],['temp','battery_temp','°C',1],['voltage','battery_voltage','V',1],['current','battery_current','A',1],['today','solar_today','kWh',1],['day','solar_today','kWh',1],['total','solar_total','kWh',1]])put(id,x[key],u,d);let b=x.battery_power,g=x.grid; $('mode').textContent=typeof b!=='number'?'—':b>5?'Ontladen · '+fmt(b,'W'):b< -5?'Laden · '+fmt(-b,'W'):'Rust';$('gridmode').textContent=typeof g!=='number'?'—':g>5?'Injectie (test)':g< -5?'Afname (test)':'Geen stroom';wire('sunwire',x.solar,false);wire('batwire',b,b<0);wire('gridwire',g,g>0)}async function update(){if(busy)return;busy=true;try{let r=await fetch('http://127.0.0.1:8765/',{cache:'no-store',signal:AbortSignal.timeout(85000)});if(!r.ok)throw Error(r.status);let x=await r.json();render(x);$('status').textContent='Sungrow · '+new Date().toLocaleTimeString('nl-BE')+(Object.values(x).some(v=>v===null)?' · onvolledige meting':' · verbonden')}catch(e){render({});$('status').textContent='Sungrow niet bereikbaar · '+e.message}finally{busy=false;setTimeout(update,5000)}}$('refresh').onclick=update;function clock(){$('clock').textContent=new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});$('clock').append(document.createElement('br'),Object.assign(document.createElement('small'),{textContent:new Date().toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}))}clock();setInterval(clock,1000);async function weather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=50.97&longitude=3.96&current=temperature_2m&timezone=Europe%2FBrussels');if(!r.ok)throw Error();put('weather',(await r.json()).current.temperature_2m,'°C',1)}catch{$('weather').textContent='—'}}weather();setInterval(weather,900000);update();</script></html>
