<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiAWaVi – P1 test</title><style>body{font-family:system-ui;background:#151b25;color:#f5f7fa;padding:24px}main{max-width:650px;margin:auto;background:#25364b;padding:24px;border-radius:18px}button{padding:13px 18px;border:0;border-radius:9px;background:#e0ae41;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101823;padding:14px;border-radius:9px}small{color:#b8c5d6}</style></head><body><main><h1>HomeWizard P1 – verbindingstest</h1><p>Deze test probeert de lokale P1-meter te bereiken vanuit de GitHub Pages-dashboardpagina.</p><button id="go">Test verbinding</button><p id="status">Nog niet getest.</p><pre id="out"></pre><small>Een fout door HTTPS/HTTP (mixed content) of CORS betekent niet dat de P1-meter defect is. Het adres werkt alleen op je thuisnetwerk.</small></main><script>document.getElementById('go').onclick=async()=>{const s=document.getElementById('status'),o=document.getElementById('out');s.textContent='Verbinding testen…';o.textContent='';try{const r=await fetch('http://192.168.0.234/api/v1/data',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();s.textContent='Gegevens ontvangen!';o.textContent='Actueel vermogen: '+(d.active_power_w??'niet gevonden')+' W\n'+ 'Netafname totaal: '+(d.total_power_import_kwh??'niet gevonden')+' kWh\n'+'Teruglevering totaal: '+(d.total_power_export_kwh??'niet gevonden')+' kWh';}catch(e){s.textContent='Niet bereikbaar vanuit deze webpagina.';o.textContent='Fout: '+e.message+'\nMogelijke oorzaak: blokkering van HTTP vanaf HTTPS, of CORS.';}};</script></body></html>
