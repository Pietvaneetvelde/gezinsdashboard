<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILvA API-test</title><style>body{font:17px system-ui;background:#102334;color:white;max-width:650px;margin:30px auto;padding:20px}section,pre{background:#193e53;padding:18px;border-radius:14px}input,button{font:inherit;padding:12px;border-radius:8px;margin:6px 0;max-width:90%}button{background:#087fae;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9d4e5}</style><h1>ILvA – API-test</h1><label for="id">Adresnummer uit Request URL</label><br><input id="id" inputmode="numeric" placeholder="Adresnummer"><br><button id="go">Ophaling ophalen</button><button id="clear">Adres wissen</button><section><small>VOLGENDE OPHALING</small><h2 id="date">Nog niet opgehaald</h2><div id="types"></div><p id="status" role="status"></p></section><h3>Ruwe API-gegevens</h3><pre id="raw">—</pre><script>
const el=id=>document.getElementById(id);try{el('id').value=localStorage.getItem('ilva-test-address')||''}catch(e){};el('clear').onclick=()=>{try{localStorage.removeItem('ilva-test-address')}catch(e){};el('id').value='';el('date').textContent='Nog niet opgehaald';el('types').textContent='';el('raw').textContent='—';el('status').textContent='Adres gewist'};
function findCollections(o,out=[]){if(!o||typeof o!=='object')return out;if(o.day?.start_date&&Array.isArray(o.waste_types))out.push(o);for(const v of Object.values(o))if(v&&typeof v==='object')findCollections(v,out);return out}
el('go').onclick=async()=>{const id=el('id').value.trim();if(!/^\d+$/.test(id)){el('status').textContent='Voer een geldig numeriek adresnummer in.';return}try{localStorage.setItem('ilva-test-address',id)}catch(e){};el('go').disabled=true;el('clear').disabled=true;el('date').textContent='Ophalen…';el('types').textContent='';el('raw').textContent='—';el('status').textContent='Verbinding maken…';try{const r=await fetch('https://sync-new-ilva-be.cloud.glue.be/api/addresses/'+encodeURIComponent(id)+'/next-collection',{credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();el('raw').textContent=JSON.stringify(data,null,2);const rows=findCollections(data);if(!rows.length){el('date').textContent='Geen herkenbare ophaling';el('status').textContent='API bereikbaar, maar gegevensstructuur nog te onderzoeken.';return}el('date').textContent=rows.map(x=>new Date(x.day.start_date).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})).join(' / ');el('types').textContent=rows.map(x=>x.waste_types.map(w=>w.name||('Afvalsoort ID '+w.waste_type_id)).join(', ')).join(' / ');el('status').textContent='API succesvol uitgelezen (HTTP '+r.status+').'}catch(e){el('date').textContent='Ophalen mislukt';el('status').textContent=e.message+' — controleer netwerk en CORS.'}finally{el('go').disabled=false;el('clear').disabled=false}};
</script></html>
