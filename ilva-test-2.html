<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILvA – kalendertest</title><style>body{background:#102334;color:#fff;font:18px system-ui;padding:24px;max-width:800px;margin:auto}input,button{font:inherit;padding:12px;border:0;border-radius:8px;margin:4px}button{background:#176b98;color:white}section,pre{background:#193e53;padding:18px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.entry{padding:12px;border-bottom:1px solid #ffffff33}small{color:#b9d6e6}</style><h1>ILvA – kalendertest</h1><label for="addr">Adresnummer</label><br><input id="addr" inputmode="numeric" autocomplete="off"><button id="go">Kalender ophalen</button><button id="clear">Adres wissen</button><p id="status" role="status"></p><section id="out">Nog geen gegevens.</section><details><summary>Ruwe API-gegevens</summary><pre id="raw"></pre></details><script>
const $=id=>document.getElementById(id);const colors={1:'#aaa',4:'#e4c54a',6:'#8cbacb',14:'#46ae65',22:'#398fe5'};try{$('addr').value=localStorage.getItem('ilva-test-address')||''}catch(e){}
function rows(x){if(Array.isArray(x))return x.flatMap(rows);if(x&&typeof x==='object'){if(typeof x.date==='string'&&x.waste_type&&typeof x.waste_type.name==='string')return [x];return Object.values(x).flatMap(rows)}return []}
$('go').onclick=async()=>{const id=$('addr').value.trim();if(!/^\d+$/.test(id)){ $('status').textContent='Vul een geldig adresnummer in.';return}try{localStorage.setItem('ilva-test-address',id)}catch(e){}$('go').disabled=true;$('status').textContent='Ophalen…';$('out').textContent='';$('raw').textContent='';try{const r=await fetch('https://sync-new-ilva-be.cloud.glue.be/api/addresses/'+encodeURIComponent(id)+'/days',{credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();$('raw').textContent=JSON.stringify(j,null,2);const all=rows(j);if(!all.length)throw Error('Geen herkenbare kalenderregels; bekijk de ruwe gegevens.');const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const grouped=new Map();for(const a of all){if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||a.date<today)continue;if(!grouped.has(a.date))grouped.set(a.date,new Map());grouped.get(a.date).set(a.waste_type.id,a.waste_type.name)}const dates=[...grouped.keys()].sort();$('status').textContent='API succesvol uitgelezen (HTTP '+r.status+'). '+all.length+' kalenderregels, '+dates.length+' komende ophaaldagen.';if(!dates.length)$('out').textContent='Geen toekomstige ophalingen in de ontvangen gegevens.';for(const d of dates.slice(0,10)){const div=document.createElement('div');div.className='entry';const strong=document.createElement('strong');strong.textContent=new Intl.DateTimeFormat('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T00:00:00Z'));div.append(strong);for(const [id,name] of grouped.get(d)){const line=document.createElement('div');line.style.color=colors[id]||'#fff';line.textContent='● '+name+' (ID '+id+')';div.append(line)}$('out').append(div)}}catch(e){$('status').textContent='Test mislukt: '+e.message}finally{$('go').disabled=false}};$('clear').onclick=()=>{try{localStorage.removeItem('ilva-test-address')}catch(e){}$('addr').value='';$('out').textContent='Nog geen gegevens.';$('raw').textContent='';$('status').textContent=''};
</script></html>
