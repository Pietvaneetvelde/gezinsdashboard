<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sungrow test</title><style>body{background:#142333;color:white;font:20px system-ui;text-align:center;padding:30px}h1{font-size:28px}#value{font-size:64px;color:#70dfa3}button{padding:12px 24px;font:inherit;border:0;border-radius:10px}#status{overflow-wrap:anywhere}</style><h1>PiAWaVi – Sungrow test</h1><p id="value">— %</p><p id="status">Verbinding testen…</p><button id="retry">Opnieuw uitlezen</button><script>
let busy=false;async function read(){if(busy)return;busy=true;const v=document.getElementById('value'),s=document.getElementById('status');try{const r=await fetch('http://127.0.0.1:8765/',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(typeof d.battery!=='number'||d.battery<0||d.battery>100)throw Error('Ongeldige batterijwaarde');v.textContent=d.battery.toLocaleString('nl-BE',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';s.textContent='Verbinding geslaagd – '+new Date().toLocaleTimeString('nl-BE');}catch(e){v.textContent='— %';s.textContent='Uitlezen mislukt: '+e.message;}finally{busy=false;}}document.getElementById('retry').onclick=read;read();setInterval(read,15000);
</script></html>
