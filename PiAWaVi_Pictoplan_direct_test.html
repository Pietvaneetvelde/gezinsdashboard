<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiAWaVi – Pictoplan rechtstreeks testen</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101722;color:#f4f8ff;font:18px system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{max-width:550px;width:100%;background:#172c42;border:1px solid #426681;border-radius:20px;padding:25px}h1{font-size:26px;margin:0 0 12px}p{line-height:1.5;color:#b9d2e5}button{width:100%;padding:18px;border:0;border-radius:13px;background:#a87925;color:white;font-size:20px;font-weight:700}#result{margin-top:18px;min-height:45px;padding:12px;background:#102235;border-radius:10px;overflow-wrap:anywhere}.small{font-size:13px}</style></head><body><div class="card"><h1>PiAWaVi · Pictoplan-test</h1><p>Deze pagina test of Fully Kiosk Pictoplan rechtstreeks kan starten, zonder de appkiezer.</p><button id="start">📅 Open Pictoplan rechtstreeks</button><div id="result" role="status">Nog niet getest.</div><p class="small">Open deze pagina in Fully Kiosk, niet in Chrome. De test verandert niets aan het bestaande dashboard. De JavaScript-interface van Fully moet ingeschakeld zijn.</p></div><script>document.getElementById('start').addEventListener('click',function(){const r=document.getElementById('result');try{if(typeof fully==='undefined'){r.textContent='Fully JavaScript-interface niet gevonden. Open in Fully Kiosk en controleer Enable JavaScript Interface (PLUS).';return}if(typeof fully.startApplication!=='function'){r.textContent='De functie fully.startApplication is niet beschikbaar in deze versie van Fully Kiosk.';return}r.textContent='Startopdracht voor Pictoplan verzonden. Kijk of Pictoplan opent.';const result=fully.startApplication('com.lorenzomoreno.pictogramagenda');if(result!==undefined)r.textContent+=' Antwoord: '+String(result)}catch(e){r.textContent='Fout bij openen: '+(e&&e.message?e.message:String(e))}})</script></body></html>
