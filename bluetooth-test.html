<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bluetooth-test</title><style>body{background:#17191d;color:#fff;font:20px system-ui;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#292d34;padding:16px;border-radius:12px}button{padding:12px;font:inherit}</style><h1>Bluetooth-test</h1><p>Schakel de DAB-36 aan en uit. De gegevens worden elke seconde vernieuwd.</p><button onclick="check()">Nu controleren</button><p id="status"></p><pre id="data"></pre><script>function check(){const s=document.getElementById('status'),d=document.getElementById('data');try{if(typeof fully==='undefined')throw Error('Fully JavaScript-interface niet beschikbaar');if(typeof fully.btGetDeviceListJson!=='function')throw Error('Bluetooth-functie niet beschikbaar');const raw=fully.btGetDeviceListJson();s.textContent='Uitgelezen om '+new Date().toLocaleTimeString();try{d.textContent=JSON.stringify(JSON.parse(raw),null,2)}catch(e){d.textContent=String(raw)}}catch(e){s.textContent='Niet beschikbaar';d.textContent=String(e)}}check();setInterval(check,1000);</script></html>
